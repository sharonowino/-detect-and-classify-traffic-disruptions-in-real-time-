name: Deploy to Streamlit Community Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Streamlit
        run: |
          python -c "import streamlit; print('Streamlit version:', streamlit.__version__)"
          python -c "import pandas; print('Pandas version:', pandas.__version__)"
          python -c "import plotly; print('Plotly version:', plotly.__version__)"

      - name: Deploy to Streamlit Community Cloud
        uses: streamlit/community-cloud-deploy@v1
        with:
          repository: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          app-path: realtime_early_warning_dashboard.py
          requirements: requirements.txt
        env:
          STREAMLIT_APP_URL: https://${{ github.repository }}.streamlit.app
