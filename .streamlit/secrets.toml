# Transit Sentinel - Production Secrets Configuration
# Copy this file to secrets.toml and fill in your actual values



# API Keys
[api_keys]
# GTFS-RT Feed URLs
GTFS_VEHICLE_URL = "http://gtfs.ovapi.nl/nl/vehiclePositions.pb"
GTFS_TRIP_UPDATE_URL = "http://gtfs.ovapi.nl/nl/tripUpdates.pb"
GTFS_ALERTS_URL = "http://gtfs.ovapi.nl/nl/alerts.pb"

# AVL (Automatic Vehicle Location) Feed
AVL_FEED_URL = "https://avl.example.com/api/v1/positions"
AVL_API_KEY = "your_avl_api_key_here"

# CAD (Computer Aided Dispatch) Alert Export
CAD_EXPORT_URL = "https://cad.example.com/api/alerts/export"
CAD_API_KEY = "your_cad_api_key_here"

# External Services
[external]
# Weather API for environmental context
WEATHER_API_KEY = "your_weather_api_key_here"
WEATHER_API_URL = "https://api.weather.example.com/v1"

# ML Model Configuration
[ml]
# Path to trained model file
MODEL_PATH = "models/disruption_model.pkl"
SCALER_PATH = "models/feature_scaler.pkl"

# Feature Engineering Configuration
[features]
# Window sizes for aggregations (in minutes)
AGGREGATION_WINDOWS = [5, 15, 30]
# Bunching threshold (seconds between vehicles)
BUNCHING_THRESHOLD = 180
# Speed drop threshold (percentage)
SPEED_DROP_THRESHOLD = 0.25

# Cache Configuration
[cache]
# TTL for cached data (seconds)
DATA_CACHE_TTL = 300
# TTL for model predictions (seconds)
MODEL_CACHE_TTL = 60

